server:
  port: 8082

spring:
  application:
    name: church-user-service
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: CHURCH_APP
    password: church_password
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

logging:
  level:
    root: INFO
    com.jeimandei.imanuelbytes.user: INFO
